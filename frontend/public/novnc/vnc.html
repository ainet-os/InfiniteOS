<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>虚拟机控制台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
    }
    #top_bar {
      background: #2d2d2d;
      color: #fff;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    #status {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    #status.connected {
      background: #4caf50;
    }
    #status.disconnected {
      background: #f44336;
    }
    #status.connecting {
      background: #ff9800;
    }
    #screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    #vnc_iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .loading {
      color: #fff;
      text-align: center;
    }
    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="top_bar">
    <div>
      <span id="status" class="disconnected">未连接</span>
      <span id="statusText" style="margin-left: 16px;">正在连接...</span>
    </div>
    <button id="disconnectBtn" onclick="disconnect()" style="padding: 4px 12px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer;">断开连接</button>
  </div>
  <div id="screen">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>正在连接VNC服务器...</p>
    </div>
    <iframe id="vnc_iframe" style="display: none;"></iframe>
  </div>

  <script>
    // 从URL参数获取连接信息
    const urlParams = new URLSearchParams(window.location.search);
    const host = urlParams.get('host') || 'localhost';
    const port = urlParams.get('port') || '6080';
    
    const wsUrl = `ws://${host}:${port}`;
    
    const statusEl = document.getElementById('status');
    const statusTextEl = document.getElementById('statusText');
    const loadingEl = document.getElementById('loading');
    const iframe = document.getElementById('vnc_iframe');
    
    // 使用iframe加载VNC客户端（隔离环境）
    function loadVNCClient() {
      statusTextEl.textContent = '加载VNC客户端...';
      statusEl.className = 'connecting';
      statusEl.textContent = '连接中';
      
      // 设置iframe源
      const clientUrl = `/novnc/vnc-client.html?wsUrl=${encodeURIComponent(wsUrl)}`;
      iframe.src = clientUrl;
      
      // 监听iframe加载
      iframe.onload = () => {
        setTimeout(() => {
          statusEl.className = 'connected';
          statusEl.textContent = '已连接';
          statusTextEl.textContent = '已连接到虚拟机';
          loadingEl.style.display = 'none';
          iframe.style.display = 'block';
        }, 1000);
      };
      
      iframe.onerror = () => {
        statusEl.className = 'disconnected';
        statusEl.textContent = '连接失败';
        statusTextEl.textContent = '加载VNC客户端失败';
        loadingEl.innerHTML = `
          <div class="spinner"></div>
          <p>加载VNC客户端失败</p>
          <p style="margin-top: 16px; font-size: 12px; color: #999;">
            WebSocket地址: ${wsUrl}<br>
            VNC端口: ${urlParams.get('vncPort') || '未知'}<br>
            <br>
            请检查websockify服务是否运行
          </p>
        `;
      };
    }
    
    function disconnect() {
      if (iframe) {
        iframe.src = 'about:blank';
      }
      statusEl.className = 'disconnected';
      statusEl.textContent = '已断开';
      statusTextEl.textContent = '连接已关闭';
      loadingEl.style.display = 'block';
      iframe.style.display = 'none';
    }
    
    // 页面加载时连接
    loadVNCClient();
    
    // 导出断开函数供按钮使用
    window.disconnect = disconnect;
  </script>
</body>
</html>
