<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat - Qwen2.5-0.5B</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #2563eb; color: white; padding: 20px; text-align: center; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; max-width: 900px; margin: 0 auto; width: 100%; }
        .message { margin: 15px 0; display: flex; }
        .message.user { justify-content: flex-end; }
        .message-content { max-width: 70%; padding: 12px 16px; border-radius: 12px; word-wrap: break-word; }
        .message.user .message-content { background: #2563eb; color: white; }
        .message.assistant .message-content { background: white; border: 1px solid #e5e7eb; }
        .input-area { background: white; padding: 20px; border-top: 1px solid #e5e7eb; }
        .input-wrapper { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; }
        #input { flex: 1; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; }
        #send { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        #send:hover { background: #1d4ed8; }
        #send:disabled { background: #9ca3af; cursor: not-allowed; }
        .loading { color: #6b7280; font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Ollama Chat - Qwen2.5-0.5B Instruct</h1>
        <p>模型服务: http://192.168.4.39:8000</p>
    </div>
    <div class="chat-container" id="chat"></div>
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="input" placeholder="输入消息，按Enter发送..." />
            <button id="send">发送</button>
        </div>
    </div>
    
    <script>
        // 使用相对路径通过前端代理访问，避免CORS问题
        const API_URL = '/api/ollama/chat';
        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        let messages = [];
        
        function addMessage(role, content) {
            messages.push({ role, content });
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + role;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            messageDiv.appendChild(contentDiv);
            chatDiv.appendChild(messageDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }
        
        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;
            
            addMessage('user', message);
            input.value = '';
            sendBtn.disabled = true;
            
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            const loadingContent = document.createElement('div');
            loadingContent.className = 'message-content loading';
            loadingContent.textContent = '思考中...';
            loadingDiv.appendChild(loadingContent);
            chatDiv.appendChild(loadingDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
            
            // 重试机制：最多重试3次
            let retries = 3;
            let lastError = null;
            
            while (retries > 0) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'qwen2.5-0.5b-instruct',
                            messages: messages,
                            stream: false
                        })
                    });
                    
                    // 安全地移除loading提示
                    if (loadingDiv && loadingDiv.parentNode === chatDiv) {
                        chatDiv.removeChild(loadingDiv);
                    }
                    
                    if (!response.ok) {
                        // 如果是403错误，尝试重试
                        if (response.status === 403 && retries > 1) {
                            retries--;
                            await new Promise(resolve => setTimeout(resolve, 500)); // 等待500ms后重试
                            continue;
                        }
                        
                        let errorMsg = '请求失败';
                        try {
                            const error = await response.json();
                            errorMsg = error.error || error.message || response.statusText;
                        } catch (e) {
                            errorMsg = response.statusText || '未知错误';
                        }
                        addMessage('assistant', '错误: ' + errorMsg + ' (状态码: ' + response.status + ')');
                        return;
                    }
                    
                    const data = await response.json();
                    const reply = data.message?.content || data.response || '无响应';
                    addMessage('assistant', reply);
                    return; // 成功，退出重试循环
                } catch (error) {
                    lastError = error;
                    retries--;
                    if (retries > 0) {
                        await new Promise(resolve => setTimeout(resolve, 500)); // 等待500ms后重试
                        continue;
                    }
                }
            }
            
            // 所有重试都失败
            if (loadingDiv && loadingDiv.parentNode === chatDiv) {
                chatDiv.removeChild(loadingDiv);
            }
            console.error('请求错误:', lastError);
            addMessage('assistant', '错误: ' + (lastError?.message || '请求失败，请重试') + '。请检查Ollama服务是否正常运行。');
            
            sendBtn.disabled = false;
            input.focus();
        }
        
        sendBtn.onclick = sendMessage;
        input.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
        input.focus();
    </script>
</body>
</html>
